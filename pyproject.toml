[build-system]
requires = ["setuptools >= 84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dca"
version = "2.2.3"
description = "Decline Curve Analysis"
requires-python = ">= 3.11"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    { name = "Tommy Odland"},
    { name = "Knut Utne Hollund", email = "kuho@equinor.com" }
]
license = "MIT" 
dependencies = [
    "ipython>=9.18.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pdm-datareader>=2.5.5",
    "pillow>=13.0.0",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "setuptools>=84.2.1",
    "tabulate>=0.10.0",
    "tornado>=6.6",
]

[project.urls]
homepage = "https://github.com/equinor/decline-curve-analysis/"
documentation = "https://equinor.github.io/decline-curve-analysis/"

[tool.setuptools]
packages = ["dca", "dca.adca", "dca.datasets"]

[tool.setuptools.package-data]
"dca.datasets" = ["*.csv"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "jupytext>=1.19.6",
    "ruff>=0.17.3",
    "sphinx>=9.0.4",
]
docs = [
    "sphinx-gallery>=0.22.1",
    "sphinx-rtd-theme>=3.1.0",
]



[project.scripts]
adca = "dca.adca.__main__:run"
